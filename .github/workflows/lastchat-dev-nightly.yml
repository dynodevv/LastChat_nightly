name: Build Dev APK (Nightly & Manual)

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"
  push:
    branches:
      - LastChat_dev

permissions:
  contents: read

jobs:
  build-dev-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web-ui/package-lock.json

      - name: Install web UI dependencies
        working-directory: web-ui
        run: npm ci

      - name: Prepare debug google-services config
        run: |
          cat > app/google-services.json <<'JSON'
          {
            "project_info": {
              "project_number": "1234567890",
              "project_id": "lastchat-dev-ci",
              "storage_bucket": "lastchat-dev-ci.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:1234567890:android:1234567890abcdef123456",
                  "android_client_info": {
                    "package_name": "lastchat.rikkafork.cocolal.dev"
                  }
                },
                "oauth_client": [],
                "api_key": [
                  {
                    "current_key": "debug-placeholder-key"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": []
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          JSON

      - name: Build dev debug APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDevDebug

      - name: Upload dev debug APK
        uses: actions/upload-artifact@v4
        with:
          name: lastchat-dev-debug-apk
          path: app/build/outputs/apk/dev/debug/*.apk
          if-no-files-found: error
